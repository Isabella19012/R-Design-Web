<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>ARRAYS E MATH</title>

<body>
    <h1>ARRAYS E MATH</h1>
    <h2>Arrays</h2>
    <script>
        //arrays é uma lista de itens
        //criação
        const nums = [4,7,8,9]
        const alunos = ["Jose", "Isabella", "Arthur", "Raquel", "Isadora",'Maria Clara', 'Davi', 'Claudia']
        const frutas = [];
        frutas[0] = "Mamão";
        frutas[1] = 'Goiaba';
        const lanche = new Array('Biscoito', "Bolo", "Macarrão");
        console.log(lanche)
    </script>
    <p id="resultado"></p>

    <script>
        let resultado = document.getElementById('resultado')
        // acessar um valor passando um índice - 6a pposição
        resultado.innerHTML = alunos[1];
        //imprimir a lista em formato de texto 
        resultado.innerHTML = alunos.toString();
        // gera uma lista em formato JSON
        resultado.innerHTML = JSON.stringify(alunos)
        // numero total de itens da lista
        resultado.innerHTML = alunos.length;
        //retorna o penultimo numero
        resultado.innerHTML = alunos[alunos.length-1]
        //ordenação
        resultado.innerHTML = alunos.sort();
        //adicionar valores
        resultado.innerHTML = alunos.push("Isis"); // retorna o comprimento da lista com esse novo item
        resultado.innerHTML = alunos.toString()
        //remover pop
        resultado.innerHTML = alunos.pop()
        resultado.innerHTML = alunos.toString()

        //separador personalizado
        resultado.innerHTML = alunos.join(" - ");
    </script>
    <h2>MATH</h2>
    <p id="resultado2"></p>
    <script>
        let resultado2 = document.getElementById('resultado2')
        //arresonda para o mais proximo
        resultado2.innerHTML = "Arredonda o valor round: "+Math.round(5.3);
        //.ceil(5.4) - arredonda para cima
        //floor(5.7) - arredonda para baixo
        resultado2.innerHTML = "Pra cima: "+Math.ceil(5.4);
        resultado2.innerHTML = "Pra baixo: "+Math.floor(5.7);
        // retorna 1 numero minimo e outro o maximo
        resultado2.innerHTML = Math.min(4,7,8,5,6,3,2)
        resultado2.innerHTML = Math.max(4,7,8,5,6,3,2)

        //numero randômico entre 0 e 1
        console.log(resultado2.innerHTML = Math.random())

        //numero aleatorio entre 0 e 10
        resultado2.innerHTML = Math.floor(Math.random()*10)
    </script>
