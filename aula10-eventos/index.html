<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos com - javascript</title>
    <style>
        body{
            height: 200rem;

        }
    </style>
</head>
<body>
    <h1>Eventos</h1>
    <form action="" name="cadastro">
        <label >Nome: <input type="text" id="nome"></label><br>
        <label>Cidade:
            <select id="cidade">
                <option value="natal">Natal</option>
                <option value="recife">Recife</option>
                <option value="jp">João Pessoa</option>
            </select>
        </label> <br>
        <input type="submit" value="ENVIAR">
    </form>
    <script>

        document.body.addEventListener("click", function(e){
            console.log("Evento de click no body.")
        })
        //A área do body vai ate onde tem texto, se for muito curto,
        //  será necessário colocar altura no css.
        //Não precisa colocar o getElementyById quando é body...
        //Posso trabalhar com a função separadamente:
        function eventoClick(){
            console.log("Evento click com função separada.")

        }
        document.body.addEventListener('click', eventoClick); //aqui é o evento chamando a função
        //vantagem de separr a função é que posso usar esse função várias vezes.
        window.addEventListener('load', function(e){
            console.log("Evento chamando ao carregar a página");
        })
        window.addEventListener("scroll", function(e){
            console.log("Scroll acionado!")
            //para este evento funcionar é necessario ter barra de rolagem!
        })

        const nome = document.getElementById("nome");
        nome.addEventListener("keydown", function(e){
            console.log("tecla acionada: "+e.key)
            //o "e" é uma propriedade nativa do evento
        })

        const cidade = document.getElementById("cidade");
        cidade.addEventListener('change', function(e){
            console.log("Evento Change chamado.")
        })

        window.addEventListener('mousemove', function(e){
            console.log("Evento MOUSEMOVE. X="+ e.clientX + " Y=" + e.clientY)
        })
        //click, dbclick, mousedown, mouseup, mouseover, mouseout....

    </script>
</body>
</html>
